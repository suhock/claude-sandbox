# Prevent escape characters from being printed on launch
set -s escape-time 200

set -g history-limit 100000
set -g detach-on-destroy on

# Needed by Claude Code
set -g focus-events on

# Mouse and scroll support
set -g mouse on
set -g terminal-overrides 'xterm*:smcup@:rmcup@'

# Pass through pane title to terminal title
set -g set-titles on
set -g set-titles-string '#{pane_title}'

# Enable key combinations like Shift-Enter
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Enable 24-bit truecolor passthrough (Claude Code emits RGB when COLORTERM=truecolor)
set -as terminal-features 'xterm*:RGB'

# Status bar
set -g status-left-length 80

# Set status bar background to Claude Code pink
set -g status-style '#{?client_prefix,bg=yellow fg=black,bg=colour174 fg=black}'

# Add new claude and bash session buttons to right of status bar
set -g status-right '#[range=user|newclaude] c:+Claude #[norange] #[range=user|newbash] b:+Bash #[norange] '

# Click handler for status bar buttons (falls back to default window switching)
bind -T root MouseDown1Status {
    if -F '#{==:#{mouse_status_range},newclaude}' {
        run-shell '/opt/sandbox/new-window.sh claude'
    } {
        if -F '#{==:#{mouse_status_range},newbash}' {
            run-shell '/opt/sandbox/new-window.sh bash'
        } {
            select-window
        }
    }
}

# Prefix bindings
# Ctrl-b c = new Claude Code window
bind c run-shell '/opt/sandbox/new-window.sh claude'
# Ctrl-b b = new bash window
bind b run-shell '/opt/sandbox/new-window.sh bash'
