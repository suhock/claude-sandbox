# Prevent escape characters from being printed on launch
set -s escape-time 200

set -g history-limit 100000
set -g detach-on-destroy on

# Needed by Claude Code
set -g focus-events on

# Mouse and scroll support
set -g mouse on
set -g terminal-overrides 'xterm*:smcup@:rmcup@'

# Pass through pane title to terminal title
set -g set-titles on
set -g set-titles-string '#{pane_title}'

# Enable key combinations like Shift-Enter
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Enable 24-bit truecolor passthrough (Claude Code emits RGB when COLORTERM=truecolor)
set -as terminal-features 'xterm*:RGB'

# Status bar
set -g status-left-length 80

# Set status bar background to Claude Code pink
set -g status-style '#{?client_prefix,bg=yellow fg=black,bg=colour174 fg=black}'

# Add new claude and bash session buttons to right of status bar
set -g status-right ' c:+Claude   b:+Bash  '

# Click handler for the status bar buttons. tmux 3.3a has no '#[range=user|...]'
# or '#{mouse_status_range}', so clicks arrive as MouseDown1StatusRight and the
# button is identified by the click column — status-right is fixed width and
# right-aligned, so the distance from the right edge is stable at any size.
# Window list clicks still arrive as MouseDown1Status (default select-window).
bind -T root MouseDown1StatusRight run-shell 'if [ $(( #{client_width} - #{mouse_x} )) -le 10 ]; then /opt/sandbox/new-window.sh bash; else /opt/sandbox/new-window.sh claude; fi'

# Prefix bindings
# Ctrl-b c = new Claude Code window
bind c run-shell '/opt/sandbox/new-window.sh claude'
# Ctrl-b b = new bash window
bind b run-shell '/opt/sandbox/new-window.sh bash'

# User config, sourced last so it overrides the above. tmux is started with -f,
# which suppresses the default config search, so these are loaded explicitly.
# They live in the home volume and so survive rebuilds.
source-file -q ~/.tmux.conf
source-file -q ~/.config/tmux/tmux.conf
