services:
  gateway:
    volumes:
      - ${SANDBOX_ROOT:-.}/gateway/start.sh:/start.sh:ro
      - ${SANDBOX_ROOT:-.}/gateway/allowed-domains.conf:/etc/gateway/allowed-domains.d/00-base.conf:ro
  claude:
    volumes:
      - ${SANDBOX_ROOT:-.}/shared/runtime/init.sh:/init.sh:ro
      - ${SANDBOX_ROOT:-.}/shared/runtime/entrypoint.sh:/entrypoint.sh:ro
      - ${SANDBOX_ROOT:-.}/shared/runtime/tmux-picker.sh:/opt/sandbox/tmux-picker.sh:ro
      - ${SANDBOX_ROOT:-.}/shared/runtime/new-window.sh:/opt/sandbox/new-window.sh:ro
      - ${SANDBOX_ROOT:-.}/shared/config/tmux.conf:/opt/sandbox/tmux.conf:ro
      - ${SANDBOX_ROOT:-.}/shared/config/bashrc.append:/opt/sandbox/bashrc.sh:ro
