# PHP environment allowed domains.
#
# Loaded by gateway/start.sh, which strips full-line comments and blank lines.
# DO NOT use inline comments (e.g. "php.net # docs") — the loader word-splits
# unquoted, so the "#" and following words would be treated as domains.
#
# Each entry matches the apex domain AND all its subdomains (dnsmasq ipset),
# so "symfony.com" also covers cs.symfony.com, "php.net" covers pecl.php.net,
# etc. Entries here are documentation / framework sites that are effectively
# read-only (static content, no general-purpose write API for exfiltration).
# See README.md "Network security" for the attack-surface warning.

# --- PHP core, manual, PECL/PEAR (all *.php.net) ---
php.net

# --- Static analysis / refactoring / QA tools ---
# PHP-CS-Fixer docs live at cs.symfony.com (covered by symfony.com below).
phpstan.org
psalm.dev
getrector.com
phpmd.org

# --- Testing frameworks ---
phpunit.de
pestphp.com
behat.org
codeception.com

# --- Major frameworks & libraries ---
symfony.com
laravel.com
doctrine-project.org
cakephp.org
codeigniter.com
yiiframework.com
slimframework.com
getlaminas.org
laminas.dev

# --- Package management (read-only metadata + installer) ---
# repo.packagist.org serves package metadata over GET; getcomposer.org serves
# the installer/phar. These let Composer resolve dependencies and self-update.
# NOTE: `composer install` of packages NOT already in the bind-mounted
# ~/.composer/cache will still FAIL — dist downloads come from GitHub
# (codeload.github.com / api.github.com), which is a full read/write host and
# is intentionally NOT allowlisted here. Add those two domains if you need
# working installs of uncached, GitHub-hosted packages (larger attack surface).
getcomposer.org
packagist.org
repo.packagist.org
